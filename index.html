<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="content-language" content="ar" />
  <script>
    try {
      var siteLang = localStorage.getItem('hajfund-site-lang') || 'ar';
      var siteDir = siteLang === 'en' ? 'ltr' : 'rtl';
      document.documentElement.lang = siteLang;
      document.documentElement.dir = siteDir;
      document.querySelector('meta[http-equiv="content-language"]').setAttribute('content', siteLang);
    } catch (e) {}
  </script>
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="المجلس الأعلى للسكان — شركاء في صناعة المستقبل" />
  <title>المجلس الأعلى للسكان</title>
  <script>
    try {
      if (localStorage.getItem('hajfund-theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
